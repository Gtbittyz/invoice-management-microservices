<div class="page-container">
    <div style="display:flex; align-items:center; margin-bottom:16px;">
        <h1 style="margin:0;">Notas Fiscais</h1>
        <span class="spacer"></span>
        <button mat-raised-button color="primary" routerLink="/notas-fiscais/nova">
            <mat-icon>add</mat-icon> Nova nota fiscal
        </button>
    </div>

    @if (carregando) {
    <div style="display:flex; justify-content:center; padding:32px;">
        <mat-spinner diameter="40"></mat-spinner>
    </div>
    } @else {
    <table mat-table [dataSource]="notas" class="full-width mat-elevation-z2">
        <ng-container matColumnDef="numero">
            <th mat-header-cell *matHeaderCellDef>Número</th>
            <td mat-cell *matCellDef="let n">{{ n.numero }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let n">
                <mat-chip [color]="n.status === 'Aberta' ? 'accent' : 'primary'" selected>
                    {{ n.status }}
                </mat-chip>
            </td>
        </ng-container>

        <ng-container matColumnDef="criadaEm">
            <th mat-header-cell *matHeaderCellDef>Criada em</th>
            <td mat-cell *matCellDef="let n">{{ n.criadaEm | date: 'dd/MM/yyyy HH:mm' }}</td>
        </ng-container>

        <ng-container matColumnDef="itens">
            <th mat-header-cell *matHeaderCellDef>Itens</th>
            <td mat-cell *matCellDef="let n">{{ n.itens.length }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let n">
                <a mat-icon-button [routerLink]="['/notas-fiscais', n.id]" aria-label="Ver detalhes">
                    <mat-icon>visibility</mat-icon>
                </a>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>

    @if (notas.length === 0) {
    <p style="text-align:center; margin-top:24px; color:#666;">Nenhuma nota fiscal cadastrada ainda.</p>
    }
    }
</div>
