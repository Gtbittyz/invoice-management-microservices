<div class="page-container">
    <h1>Nova nota fiscal</h1>

    <form [formGroup]="form" (ngSubmit)="salvar()">
        <div formArrayName="itens">
            @for (item of itens.controls; track item; let i = $index) {
            <div [formGroupName]="i" style="display:flex; gap:12px; align-items:flex-start; margin-bottom:8px;">
                <mat-form-field appearance="outline" style="flex: 2;">
                    <mat-label>Produto</mat-label>
                    <mat-select formControlName="produtoId">
                        @for (produto of produtos; track produto.id) {
                        <mat-option [value]="produto.id">
                            {{ produto.codigo }} - {{ produto.descricao }} (saldo: {{ produto.saldo }})
                        </mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" style="flex: 1;">
                    <mat-label>Quantidade</mat-label>
                    <input matInput type="number" formControlName="quantidade" min="1" />
                </mat-form-field>

                <button mat-icon-button type="button" (click)="removerItem(i)" [disabled]="itens.length === 1"
                        aria-label="Remover item" style="margin-top:8px;">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
            }
        </div>

        <button mat-button type="button" (click)="adicionarItem()">
            <mat-icon>add</mat-icon> Adicionar produto
        </button>

        <div style="margin-top:24px;">
            <button mat-raised-button color="primary" type="submit" [disabled]="salvando">
                {{ salvando ? 'Salvando...' : 'Criar nota fiscal' }}
            </button>
        </div>
    </form>
</div>
